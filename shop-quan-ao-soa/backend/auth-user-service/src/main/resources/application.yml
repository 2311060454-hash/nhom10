server:
  port: 8081
  address: 127.0.0.1
  error:
    include-message: never
spring:
  application:
    name: auth-user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/shop_quan_ao_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
security:
  jwt-secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_API_KEY}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
app:
  seed-password: ${SEED_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
