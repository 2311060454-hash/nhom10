server:
  port: 8080
  address: 127.0.0.1
security:
  jwt-secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_API_KEY}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      enabled: false
