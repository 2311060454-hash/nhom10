server:
  port: 8082
  address: 127.0.0.1
spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/shop_quan_ao_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
security:
  jwt-secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_API_KEY}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app:
  upload-dir: ${UPLOAD_DIR:uploads/catalog}
management:
  endpoints:
    web:
      exposure:
        include: health,info
